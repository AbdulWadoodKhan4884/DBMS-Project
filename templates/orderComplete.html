<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-lg text-center animate__animated animate__fadeIn">
        <div class="mb-6">
            <svg class="w-20 h-20 text-green-500 mx-auto animate__animated animate__bounceIn" fill="none"
                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Order Complete!</h1>
        <p class="text-lg text-gray-600 mb-6">Your order is confirmed and ready for delivery.</p>
        <p class="text-gray-500 mb-8">Thank you for shopping with us!</p>
        <div class="animate__animated animate__pulse animate__infinite">
            <a href="/"
                class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg transition duration-300">
                Return to Home
            </a>
        </div>
    </div>
</body>

</html>
